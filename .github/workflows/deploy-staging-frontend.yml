name: Deploy frontend a staging

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-staging-frontend.yml"
  workflow_dispatch: {}

env:
  PROJECT_ID: project-26c70338-0265-4c7e-837
  REGION: us-central1
  SERVICE: eltesoro-frontend-staging
  # Reutiliza el repositorio de Artifact Registry ya creado para el backend
  # (módulo 02): el deployer SA solo tiene permiso de escritura ahí, no de
  # crear repositorios nuevos ("PERMISSION_DENIED" al intentar crear
  # "eltesoro-frontend" — ver corrida fallida del 2026-08-29). Un repositorio
  # Docker puede alojar imágenes de distintos servicios sin conflicto.
  REPOSITORY: eltesoro-backend
  API_URL: https://eltesoro-backend-staging-472679541597.us-central1.run.app/api
  # Sin el sufijo /api (a diferencia de API_URL): el proxy same-origin
  # (frontend/src/app/api/[...path]/route.ts, no un rewrite de Next) le
  # agrega /api/<path> al armar el destino de cada request.
  API_ORIGIN: https://eltesoro-backend-staging-472679541597.us-central1.run.app
  SITE_URL: https://eltesoro-frontend-staging-472679541597.us-central1.run.app
  # INF-08: next.config.ts lo lee en tiempo de arranque del servidor (no de
  # build) para armar remotePatterns de next/image — coincide con el bucket
  # real de este entorno; en producción (Módulo 09) será otro.
  PRODUCT_IMAGES_BUCKET: eltesoro-product-images-staging
  WORKLOAD_IDENTITY_PROVIDER: "projects/472679541597/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
  DEPLOYER_SA: "eltesoro-deployer@project-26c70338-0265-4c7e-837.iam.gserviceaccount.com"

permissions:
  contents: read
  id-token: write
  checks: read

jobs:
  # INF-03: ver el mismo job en deploy-staging.yml — sin esto, este
  # despliegue corría en paralelo con el CI en vez de esperarlo.
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que el CI termine en verde
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "lint-and-build"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  deploy:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Crear repositorio de Artifact Registry si no existe
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY }} \
            --project=${{ env.PROJECT_ID }} --location=${{ env.REGION }} \
            || gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --project=${{ env.PROJECT_ID }} --location=${{ env.REGION }} \
            --repository-format=docker --description="Imágenes del frontend (Módulo 03)"

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build de la imagen
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }}"
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="${{ env.API_URL }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ env.SITE_URL }}" \
            -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push de la imagen
        run: docker push "$IMAGE"

      - name: Desplegar a Cloud Run (staging)
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="$IMAGE" \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --set-env-vars="API_PROXY_TARGET=${{ env.API_ORIGIN }},PRODUCT_IMAGES_BUCKET=${{ env.PRODUCT_IMAGES_BUCKET }}" \
            --set-secrets=INTERNAL_PROXY_SECRET=eltesoro-internal-proxy-secret:latest \
            --min-instances=0 --max-instances=3 --memory=512Mi \
            --service-account="${{ env.DEPLOYER_SA }}"

      - name: URL del servicio
        run: gcloud run services describe ${{ env.SERVICE }} --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} --format="value(status.url)"
