name: Deploy backend a staging

# Reintento 2026-09-26: primer deploy falló porque eltesoro-deployer no
# tenía roles/cloudsql.client (ya corregido en GCP) — este comentario solo
# toca el workflow para volver a disparar el pipeline.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch: {}

env:
  # OPS-00: migrado el 2026-09-26 al proyecto dedicado diginet-eltesoro-stg
  # (el proyecto viejo era una instancia de prueba gratuita de Cloud SQL a
  # punto de vencer, sin backups — ver docs/revision/migracion-gcp-staging.md).
  PROJECT_ID: diginet-eltesoro-stg
  REGION: us-central1
  SERVICE: eltesoro-api-stg
  REPOSITORY: eltesoro
  SQL_CONNECTION_NAME: diginet-eltesoro-stg:us-central1:eltesoro-db-stg
  WORKLOAD_IDENTITY_PROVIDER: "projects/679837745364/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
  DEPLOYER_SA: "eltesoro-deployer@diginet-eltesoro-stg.iam.gserviceaccount.com"
  # INF-02: identidad de EJECUCIÓN del servicio (Cloud SQL Client + Secret
  # Accessor solo de sus secretos) — separada del deployer, que solo
  # despliega. Si el servicio corriendo se compromete, no hereda permisos
  # para desplegar ni leer secretos ajenos.
  RUNTIME_SA: "eltesoro-runtime@diginet-eltesoro-stg.iam.gserviceaccount.com"
  # Módulo 04 — Cuentas de usuario: URL pública del frontend de staging
  # (debe coincidir con SITE_URL de deploy-staging-frontend.yml) para armar
  # los enlaces de verificación/recuperación, y el remitente verificado en
  # Brevo (ver backend/.env.example).
  FRONTEND_URL: https://eltesoro-web-stg-679837745364.us-central1.run.app
  EMAIL_FROM: afranco.sears@gmail.com
  EMAIL_FROM_NAME: "Almacén El Tesoro"

permissions:
  contents: read
  id-token: write
  checks: read

jobs:
  # INF-03: sin esto, un push a main dispara este despliegue en paralelo con
  # el CI (lint/build/prisma validate) — código roto podía llegar a staging,
  # y las migraciones de Prisma corrían antes de saber si el build compilaba.
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que el CI termine en verde
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "lint-and-build"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      # INF-04: las pruebas de integración también deben pasar antes de
      # desplegar (auth, carrito, direcciones).
      - name: Esperar a que las pruebas de integración terminen en verde
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "test"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  deploy:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar Cloud SQL Auth Proxy
        run: |
          curl -sL -o /usr/local/bin/cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x /usr/local/bin/cloud-sql-proxy
          sudo mkdir -p /cloudsql
          sudo chmod 777 /cloudsql
          cloud-sql-proxy --unix-socket=/cloudsql "${{ env.SQL_CONNECTION_NAME }}" &
          for i in $(seq 1 10); do
            [ -S "/cloudsql/${{ env.SQL_CONNECTION_NAME }}/.s.PGSQL.5432" ] && break
            sleep 1
          done

      - name: Aplicar migraciones de Prisma contra staging
        env:
          DATABASE_URL_SECRET: eltesoro-staging-database-url
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=$DATABASE_URL_SECRET --project=${{ env.PROJECT_ID }})"
          export DATABASE_URL
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push de la imagen
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}"
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Desplegar a Cloud Run (staging)
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="$IMAGE" \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ env.SQL_CONNECTION_NAME }} \
            --set-secrets=DATABASE_URL=eltesoro-staging-database-url:latest,JWT_ACCESS_SECRET=eltesoro-jwt-access-secret:latest,BREVO_API_KEY=eltesoro-brevo-api-key:latest,INTERNAL_PROXY_SECRET=eltesoro-internal-proxy-secret:latest \
            --set-env-vars="NODE_ENV=production,CORS_ORIGINS=${{ env.FRONTEND_URL }},FRONTEND_URL=${{ env.FRONTEND_URL }},EMAIL_FROM=${{ env.EMAIL_FROM }},EMAIL_FROM_NAME=${{ env.EMAIL_FROM_NAME }}" \
            --min-instances=0 --max-instances=3 --memory=512Mi \
            --service-account="${{ env.RUNTIME_SA }}"

      - name: URL del servicio
        run: gcloud run services describe ${{ env.SERVICE }} --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} --format="value(status.url)"
