name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      # Solo para que `prisma generate`/`validate` puedan resolver el
      # datasource en CI. No se conecta a ninguna base de datos real: este
      # job no corre migraciones (eso pertenece al pipeline de despliegue
      # del módulo 09).
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validar esquema de Prisma
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Build
        run: npm run build

  # INF-04: pruebas de integración mínimas (auth, carrito, direcciones)
  # contra un Postgres real de servicio — antes no había ninguna prueba
  # automática, y checkout (Módulo 06) y pagos (07) necesitan esta base
  # antes de construirse encima.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eltesoro
          POSTGRES_PASSWORD: eltesoro
          POSTGRES_DB: eltesoro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://eltesoro:eltesoro@localhost:5432/eltesoro_test?schema=public"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # El backend importa @el-tesoro/shared desde su dist/ compilado (no
      # desde el código fuente) — sin este paso, vitest falla al resolver
      # ese import porque el workspace nunca se construyó en este job.
      - name: Compilar shared
        run: npm run build --workspace=shared

      - name: Aplicar migraciones de Prisma
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Pruebas de integración del backend
        run: npm run test --workspace=backend
